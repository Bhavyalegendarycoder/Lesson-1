<html>
    <head>
        <title>
            Forms
        </title>
    </head>
    <body>
        <form>
            <fieldset>
                <legend> Personal Details </legend>
                <label> Name </label><br>
                <input type="text" id="name"><br><br>
                <label> Email ID </label><br>
                <input type="text" id="email"><br><br>
                <label> Conatct number </label><br>
                <input type="password" id="contact"><br><br>
                <label> Gender </label><br>
                <input type="radio" id="male" name="gender" value="Male">Boy<br>
                <input type="radio" id="female" name="gender" value="Female">Girl<br>
                <label> Favourite City </label> <br>
                <input type="checkbox" id="city" value="New Delhi">New Delhi<br>
                <input type="checkbox" id="city" value="Mumbai">Mumbai<br>
                <input type="checkbox" id="city" value="Chennai">Chennai<br>
                <label> Birthday </label> <br>
                <input type="date" id="Birthday" name="Birthday"><br><br>
                <input type="Submit">
            </fieldset>
        </form>
    </body>
</html>

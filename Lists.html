<html>
    <head>
        <title> Lists </title>
    </head>
    <body>
        <h2> Ordered list</h2>
        <ol>
            <li>Apple</li>
            <li>Orange</li>
            <li>Banana</li>
        </ol>
        <h2> Unordered list</h2>
        <ul>
            <li>Apple</li>
            <li>Orange</li>
            <li>Banana</li>
        </ul>
        <h2> Description list</h2>
        <dl>
            <dt>Apple</dt>
            <dd> a red fruit</dd>
            <dt>Banana</dt>
            <dd> a yellow fruit</dd>
        </dl>
    </body>
</html>

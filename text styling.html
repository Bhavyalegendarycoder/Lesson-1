<html>
    <head>
        <title> Text Styling </title>
        <style>

            .text1 {
                color: red;

                font-size : 30px
            }

            .p1{
                color: blueviolet;
                font-family: 'Courier New', Courier, monospace;
            }

            div{
                width: 300px;
                height: 100px;
                background-color: aquamarine;
                border: 1px solid yellow;
            }
            #mydiv{
                transform: rotateX(180deg);
            }
            h1 {
                text-decoration: overline;
                text-transform: capitalize;
            }

             h2 {
                text-decoration: line-through;
                text-transform: uppercase;
             }

              h1 {
                text-decoration: underline;
                text-transform: lowercase;
             }

              h1 {
                text-decoration: underline overline;
                text-transform: none;
             }

             *{
                text-align: center;
                font-family: Baguet Script;

             }

             #text {
                text-shadow: 2px 2px 1px red;
             }

             #box {
                box-shadow:2px 2px 1px cyan;
             }

             #indent {
                text-indent: 50%;
             }

        </style>
    </head>
    <body>
        <h1> Typography </h1>
        <p class="text1">Welcome to Codingal</p>

        <p class="p1">Welcome to Codingal</p>

        <div>
            Codingal
        </div>
        <div id="mydiv">
            Codingal
        </div>
        <h1> codingal</h1>
        <h2> codingal</h2>
        <h3> CODINGAL</h3>
        <h4>CODINGAL</h4>
        <h1 id="text"> This is a text shadow. </h1>
        <h1 id="box"> This is a box shadow. </h1>

<div>

<p>text-indent.</p>

<p id="indent">This is an example of text-indent.</p>

</div>
    </body>
</html>
